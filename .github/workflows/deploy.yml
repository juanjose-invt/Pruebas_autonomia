# Construye el portfolio y lo publica en GitHub Pages junto con las ocho apps.
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; no se cancela la que ya está en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      # Genera _site/: el portfolio en la raíz y las carpetas de las apps (gastos/, kanban/, juego/, herramientas/,
      # presupuestos/, panel/, escaner/ y pizza/) copiadas tal cual; las que no existan se omiten.
      - name: Construir el sitio
        run: node scripts/build.mjs

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
