<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tirada — panel de datos instantáneo</title>
<meta name="description" content="Arrastra un CSV o un Excel y obtén un panel interactivo impreso en tintas de risografía. Los datos se procesan en tu dispositivo y no se envían a ningún sitio.">
<meta name="theme-color" content="#F2F1EC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preload" href="fonts/epilogue-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg id="riso-defs" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;overflow:hidden">
  <defs>
    <pattern id="riso-grain" patternUnits="userSpaceOnUse" width="192" height="192"><image id="riso-grain-img" width="192" height="192" href="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACwAAAAAAQABAAACAkQBADs="/></pattern>
    <mask id="riso-speckle" maskUnits="userSpaceOnUse" x="-400" y="-400" width="5000" height="5000"><rect x="-400" y="-400" width="5000" height="5000" fill="url(#riso-grain)"/></mask>
    <pattern id="riso-dots-blue" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(15)"><circle cx="2.5" cy="2.5" r="1.1" fill="#3D5588"/></pattern>
    <pattern id="riso-hatch-blue" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="2.4" height="6" fill="#3D5588"/></pattern>
  </defs>
</svg>

<a class="skip" href="#main" data-i18n="skip">Saltar al contenido</a>

<header class="mast">
  <a class="brand" href="./" id="brand">
    <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="16" cy="20" r="11" fill="#FF48B0" style="mix-blend-mode:multiply"/>
      <circle cx="24" cy="20" r="11" fill="#FFE800" style="mix-blend-mode:multiply"/>
      <path d="M20 4v32M4 20h32" stroke="#3D5588" stroke-width="2"/>
      <circle cx="20" cy="20" r="6" fill="none" stroke="#3D5588" stroke-width="2"/>
    </svg>
    <span>Tirada</span>
  </a>
  <div class="lang" role="group" data-i18n-aria="lang.label">
    <button type="button" data-lang="es" aria-pressed="true">ES</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<main id="main" tabindex="-1">
  <!-- Portada: importar -->
  <section class="start" id="start" aria-labelledby="startTitle">
    <div class="start-intro">
      <h1 class="hero" id="startTitle"><span class="hero-ink" data-i18n="start.title"></span></h1>
      <p class="lead" data-i18n="start.lead"></p>
    </div>

    <label class="drop" id="drop">
      <input type="file" id="file" class="sr" accept=".csv,.tsv,.txt,.xlsx,text/csv,text/tab-separated-values,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
      <svg class="drop-marks" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 8V0h8M92 0h8v8M100 92v8h-8M8 100H0v-8" vector-effect="non-scaling-stroke"/>
      </svg>
      <svg class="drop-icon" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="9" y="6" width="26" height="34" rx="2" fill="#FFE800" style="mix-blend-mode:multiply" transform="translate(1 1)"/>
        <rect x="13" y="10" width="26" height="34" rx="2" fill="#FF48B0" style="mix-blend-mode:multiply" transform="translate(-1 0)"/>
        <path d="M18 22h16M18 28h16M18 34h10" stroke="#3D5588" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      </svg>
      <span class="drop-text" id="dropText" data-i18n="start.drop"></span>
      <span class="btn primary" data-i18n="start.choose" aria-hidden="true"></span>
      <span class="drop-formats">CSV · TSV · XLSX</span>
    </label>
    <p class="status" id="importStatus" role="status" aria-live="polite"></p>
    <p class="import-error" id="importError" role="alert" hidden></p>

    <div class="start-cols">
      <section class="samples" aria-labelledby="samplesTitle">
        <h2 id="samplesTitle" data-i18n="start.samples"></h2>
        <p class="note" data-i18n="start.samplesNote"></p>
        <div class="sample-list" id="sampleList"></div>
      </section>
      <section class="saved" aria-labelledby="savedTitle">
        <h2 id="savedTitle" data-i18n="start.saved"></h2>
        <div id="resume"></div>
        <ul class="saved-list" id="savedList"></ul>
      </section>
    </div>
  </section>

  <!-- Panel generado -->
  <section class="board" id="board" hidden aria-labelledby="boardTitle">
    <div class="board-head">
      <div class="board-titles">
        <h1 id="boardTitle" class="board-title"></h1>
        <p class="board-meta" id="boardMeta"></p>
      </div>
    </div>

    <div class="toolbar" id="toolbar">
      <div class="tool-group">
        <button type="button" class="btn" id="btnFilters" aria-haspopup="dialog">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
          <span data-i18n="board.filters"></span><span class="count" id="filterCount" hidden></span>
        </button>
        <button type="button" class="btn" id="btnCols" aria-haspopup="dialog">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM10 4v16M15 4v16"/></svg>
          <span data-i18n="board.columns"></span>
        </button>
        <div class="menu-wrap">
          <button type="button" class="btn" id="btnAdd" aria-haspopup="menu" aria-expanded="false" aria-controls="addMenu">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="board.addChart"></span>
          </button>
          <div class="menu" id="addMenu" role="menu" hidden></div>
        </div>
      </div>
      <div class="tool-group end">
        <button type="button" class="btn" id="btnSave">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5zM8 4v5h8V4M8 20v-6h8v6"/></svg>
          <span data-i18n="board.save"></span>
        </button>
        <div class="menu-wrap">
          <button type="button" class="btn primary" id="btnExport" aria-haspopup="menu" aria-expanded="false" aria-controls="exportMenu">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
            <span data-i18n="board.export"></span>
          </button>
          <div class="menu end" id="exportMenu" role="menu" hidden>
            <button type="button" role="menuitem" data-export="png" data-i18n="export.png"></button>
            <button type="button" role="menuitem" data-export="pdf" data-i18n="export.pdf"></button>
            <button type="button" role="menuitem" data-export="csv" data-i18n="export.csv"></button>
          </div>
        </div>
        <button type="button" class="btn icon" id="btnClose" data-i18n-aria="board.close" data-i18n-title="board.close">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
    <div class="chips" id="chips"></div>

    <section class="kpis" id="kpis" data-i18n-aria="board.kpis"></section>
    <div id="kpiEditor"></div>
    <section class="grid" id="grid" data-i18n-aria="board.charts"></section>
    <p class="grid-empty" id="gridEmpty" hidden></p>

    <section class="table-sheet" id="tableSheet" aria-labelledby="tableTitle">
      <div class="table-head">
        <h2 id="tableTitle" data-i18n="table.title"></h2>
        <label class="search">
          <span class="sr" data-i18n="table.search"></span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
          <input type="search" id="tableSearch" data-i18n-ph="table.search" autocomplete="off" aria-describedby="searchNote">
        </label>
      </div>
      <p class="note" id="searchNote" data-i18n="table.searchNote"></p>
      <div class="table-wrap" id="tableWrap">
        <div class="table-scroll" tabindex="0" data-i18n-aria="table.title"><table><thead></thead><tbody></tbody></table></div>
        <div class="pager">
          <button type="button" class="btn icon" data-act="prev" data-i18n-aria="table.prev"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
          <span data-role="page-info"></span>
          <button type="button" class="btn icon" data-act="next" data-i18n-aria="table.next"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
      </div>
    </section>
  </section>
</main>

<footer class="foot">
  <p data-i18n="foot.privacy"></p>
  <a class="sign" href="../" data-i18n="sign">by innovativecode</a>
</footer>

<dialog class="drawer" id="dlgFilters" aria-labelledby="filtersTitle">
  <div class="drawer-head">
    <h2 id="filtersTitle" data-i18n="filters.title"></h2>
    <button type="button" class="btn icon" data-close data-i18n-aria="filters.close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <p class="note" data-i18n="filters.lead"></p>
  <p class="note" data-i18n="filters.chartHint"></p>
  <div class="drawer-body" id="filtersBody"></div>
  <div class="drawer-foot"><button type="button" class="btn" id="btnClearAll" data-i18n="board.clearFilters"></button></div>
</dialog>

<dialog class="drawer" id="dlgCols" aria-labelledby="colsTitle">
  <div class="drawer-head">
    <h2 id="colsTitle" data-i18n="cols.title"></h2>
    <button type="button" class="btn icon" data-close data-i18n-aria="cols.close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <p class="note" data-i18n="cols.lead"></p>
  <div class="drawer-body" id="colsBody"></div>
  <div class="drawer-foot"><button type="button" class="btn" id="btnRegen" data-i18n="board.regen"></button></div>
</dialog>

<dialog class="small" id="dlgSave" aria-labelledby="saveTitle">
  <form method="dialog" id="saveForm">
    <h2 id="saveTitle" data-i18n="save.title"></h2>
    <label class="field">
      <span data-i18n="save.name"></span>
      <input type="text" id="saveName" required maxlength="80" autocomplete="off">
    </label>
    <div class="row-end">
      <button type="button" class="btn" value="cancel" data-close data-i18n="save.cancel"></button>
      <button type="submit" class="btn" value="copy" id="saveCopy" data-i18n="save.copy"></button>
      <button type="submit" class="btn primary" value="save" data-i18n="save.ok"></button>
    </div>
  </form>
</dialog>

<dialog class="small" id="dlgConfirm" aria-labelledby="confirmText">
  <form method="dialog">
    <p id="confirmText"></p>
    <div class="row-end">
      <button type="submit" class="btn" value="no" data-i18n="save.cancel"></button>
      <button type="submit" class="btn primary" value="yes" id="confirmYes"></button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastText"></span><button type="button" class="btn small" id="toastAct" hidden></button></div>
<div class="tip" id="tip" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
