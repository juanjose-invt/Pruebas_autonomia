<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Presupuestos de Ofiza</title>
  <meta name="description" content="Generador gratuito de presupuestos y proformas en PDF. Funciona en el navegador y los datos no salen del dispositivo.">
  <meta name="theme-color" content="#0d251e">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/mohave-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <div class="top">
    <header class="appbar" data-theme="dark">
      <div class="wrap appbar-in">
        <a class="brand" href="#/" data-go>
          <span class="brand-mark" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect x="5" y="3" width="18" height="22" rx="3" stroke="currentColor" stroke-width="1.75"/><path d="M9.5 10h9M9.5 14h9M9.5 18h5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
          </span>
          <span class="brand-name" id="brand-name">Presupuestos</span>
          <span class="brand-by" id="brand-by">de Ofiza</span>
        </a>
        <nav class="tabs" id="nav" aria-label="Secciones">
          <a href="#/" data-go id="nav-quotes" aria-current="page">Presupuestos</a>
          <a href="#/clientes" data-go id="nav-clients">Clientes</a>
        </nav>
        <div class="lang" id="lang" role="group" aria-label="Idioma">
          <button type="button" data-lang="es" aria-pressed="true" lang="es">ES</button>
          <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
        </div>
      </div>
    </header>
    <div id="hero" data-theme="dark"></div>
  </div>

  <main id="main" tabindex="-1"></main>

  <footer class="foot" data-theme="dark">
    <div class="wrap foot-in">
      <div class="foot-notes">
        <p id="f-local">Tus datos no salen de este dispositivo: no hay servidor ni cuentas.</p>
        <p id="f-invoice">Sirve para presupuestos y proformas. No es un programa de facturación.</p>
      </div>
      <p class="foot-ofiza"><span id="f-ofiza-q">¿Quieres facturar y cobrar también?</span> <a href="https://ofiza.es" target="_blank" rel="noopener"><span id="f-ofiza">Conoce Ofiza</span></a></p>
      <a class="seal" href="../" id="f-by">by innovativecode</a>
    </div>
  </footer>

  <dialog id="dlg" class="dlg"></dialog>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body>
</html>
